version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexflow_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"

  data-plane:
    build:
      context: .
      dockerfile: containers/nexflow-data-plane/Dockerfile
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
      - "9090:9090"
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
