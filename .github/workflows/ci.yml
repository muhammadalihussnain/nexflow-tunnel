name: CI Pipeline

on:
  push:
    branches: [ main, develop, nexflow-* ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Debug

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install clang-format
      run: sudo apt-get install -y clang-format-15
    - name: Run linting
      run: |
        sudo ln -sf /usr/bin/clang-format-15 /usr/bin/clang-format
        ./scripts/lint.sh

  build:
    runs-on: ubuntu-22.04
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++-11 libssl-dev
    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    - name: Build
      run: |
        cd build
        make -j $(nproc)

  unit-tests:
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -R unit

  security:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  docker:
    runs-on: ubuntu-22.04
    needs: [unit-tests, security]
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: containers/nexflow-data-plane/Dockerfile
        push: false
        tags: nexflow/data-plane:test
        load: true
    - name: Test Docker image
      run: |
        docker run --rm nexflow/data-plane:test --version
